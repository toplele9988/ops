<div id="sg-lightbox" class="modal" role="dialog" aria-modal="true" aria-labelledby="sg-lb-title" aria-describedby="sg-lb-help" aria-hidden="true" tabindex="-1" hidden><div class="modal-dialog modal-fullscreen"><div class="modal-content">
<header class="sg-lb-toolbar"><h2 id="sg-lb-title">产品大图</h2><span id="sg-lb-counter" role="status" aria-live="polite">— / —</span><button id="sg-lb-info" type="button" aria-pressed="false" aria-controls="sg-lb-specs">参数 I</button><button id="sg-lb-original" type="button" disabled>原图</button><button id="sg-lb-close" type="button" aria-label="关闭灯箱">×</button></header>
<p id="sg-lb-help" class="visually-hidden">滚轮或双指缩放，拖动平移，方向键切换，I 键切换参数，Escape 关闭。</p>
<div class="sg-lb-main"><div id="sg-lb-stage"><img alt="" decoding="async" draggable="false" hidden><p id="sg-lb-message" role="status">正在加载图片…</p></div><button id="sg-lb-prev" class="sg-lb-arrow" type="button" aria-label="上一张">‹</button><button id="sg-lb-next" class="sg-lb-arrow" type="button" aria-label="下一张">›</button><aside id="sg-lb-specs" aria-label="产品参数" hidden><dl></dl></aside></div>
<footer class="sg-lb-footer"><div class="sg-lb-tools"><button id="sg-lb-minus" type="button" aria-label="缩小">−</button><button id="sg-lb-reset" type="button" aria-label="重置缩放">1.0×</button><button id="sg-lb-plus" type="button" aria-label="放大">＋</button><button id="sg-lb-add" class="sg-add" data-model-id="" type="button">＋ 加入报价</button>{% if can_admin %}<button id="sg-lb-mark" type="button" disabled title="图片标记功能待接入">标记为不可对客</button>{% endif %}</div><div id="sg-lb-thumbs" role="group" aria-label="图片缩略图"></div></footer>
</div></div></div>
